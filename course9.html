<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>模組 9（Lv.9）：SaaS 定價頁轉換心理學與視覺錨定工藝</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-5xl bg-slate-800/90 border border-slate-700 rounded-2xl p-6 shadow-2xl">
    <!-- Top Header -->
    <div class="flex flex-wrap items-center justify-between gap-2 pb-3 mb-3 border-b border-slate-700">
      <div class="flex items-center gap-2">
        <span class="px-2 py-0.5 text-xs font-semibold rounded-md bg-emerald-500/15 text-emerald-400">商業轉換 Lv.9</span>
        <h2 class="text-sm font-semibold text-white">SaaS 定價頁心理學 — 視覺主推錨定、增量功能與去焦慮微文案</h2>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="applyPreset('slop')" class="px-2.5 py-1 text-xs font-medium rounded-lg bg-rose-500/15 text-rose-400 hover:bg-rose-500/25 transition">
          AI 三欄均分定價表 (0/5)
        </button>
        <button onclick="applyPreset('craft')" class="px-2.5 py-1 text-xs font-medium rounded-lg bg-emerald-500/15 text-emerald-400 hover:bg-emerald-500/25 transition">
          Stripe / Linear 高轉換定價 (5/5)
        </button>
      </div>
    </div>

    <!-- Main Split Layout -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-start">
      <!-- Left: Real Page Pricing Stage (7 cols) -->
      <div class="md:col-span-7 bg-slate-100/95 rounded-xl p-4 flex flex-col justify-between min-h-[390px] text-slate-900">
        <!-- Billing Cycle Bar + Usage Estimator -->
        <div id="pricing-top" class="mb-3 flex flex-wrap items-center justify-between gap-2"></div>
        <!-- 3-Tier Cards Grid -->
        <div id="pricing-grid" class="grid grid-cols-3 gap-2.5 items-stretch"></div>
      </div>

      <!-- Right: 5 Pricing Psychology Linter Switches (5 cols) -->
      <div class="md:col-span-5 flex flex-col gap-2">
        <div class="text-xs font-medium text-slate-400 mb-0.5">
          為什麼 AI 寫的定價頁總是「三張長一樣的卡片、讓人猶豫不決」？點擊右側開啟 5 大轉換定律：
        </div>

        <button onclick="toggleRule('anchor')" class="w-full text-left p-2.5 rounded-xl border border-slate-700 flex items-start justify-between gap-2 hover:bg-slate-700/60 transition">
          <div>
            <div class="text-xs font-semibold text-white">1. 單一主推視覺錨定 (Single Primary CTA)</div>
            <div class="text-xs text-slate-400">禁止三張卡都放深色主按鈕！僅高亮 Pro 方案，其餘降階為次要按鈕</div>
          </div>
          <span id="status-anchor" class="px-2 py-0.5 text-xs rounded bg-rose-500/20 text-rose-400 shrink-0">待修正</span>
        </button>

        <button onclick="toggleRule('annual')" class="w-full text-left p-2.5 rounded-xl border border-slate-700 flex items-start justify-between gap-2 hover:bg-slate-700/60 transition">
          <div>
            <div class="text-xs font-semibold text-white">2. 年繳省 20% 膠囊與等寬跳字 (Annual Incentive)</div>
            <div class="text-xs text-slate-400">在年繳切換旁直接鑲嵌「立省 20%」綠膠囊，並以 tabular-nums 呈現月均價</div>
          </div>
          <span id="status-annual" class="px-2 py-0.5 text-xs rounded bg-rose-500/20 text-rose-400 shrink-0">待修正</span>
        </button>

        <button onclick="toggleRule('delta')" class="w-full text-left p-2.5 rounded-xl border border-slate-700 flex items-start justify-between gap-2 hover:bg-slate-700/60 transition">
          <div>
            <div class="text-xs font-semibold text-white">3. 增量式功能清單 (Incremental Feature Delta)</div>
            <div class="text-xs text-slate-400">廢除三欄重複抄寫基礎功能，改用「包含 Starter 所有功能，外加：」</div>
          </div>
          <span id="status-delta" class="px-2 py-0.5 text-xs rounded bg-rose-500/20 text-rose-400 shrink-0">待修正</span>
        </button>

        <button onclick="toggleRule('slider')" class="w-full text-left p-2.5 rounded-xl border border-slate-700 flex items-start justify-between gap-2 hover:bg-slate-700/60 transition">
          <div>
            <div class="text-xs font-semibold text-white">4. 可預測用量滑桿取代隱藏超額費 (Usage Slider)</div>
            <div class="text-xs text-slate-400">提供即時事件量滑桿動態試算價格，消除買家對「超額爆表」的恐懼</div>
          </div>
          <span id="status-slider" class="px-2 py-0.5 text-xs rounded bg-rose-500/20 text-rose-400 shrink-0">待修正</span>
        </button>

        <button onclick="toggleRule('reversal')" class="w-full text-left p-2.5 rounded-xl border border-slate-700 flex items-start justify-between gap-2 hover:bg-slate-700/60 transition">
          <div>
            <div class="text-xs font-semibold text-white">5. 零風險微承諾文案 (Risk-Reversal Micro-Copy)</div>
            <div class="text-xs text-slate-400">於主按鈕正下方標註「免綁卡 · 14 天試用 · 一鍵取消」降低決策阻力</div>
          </div>
          <span id="status-reversal" class="px-2 py-0.5 text-xs rounded bg-rose-500/20 text-rose-400 shrink-0">待修正</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const state = {
      anchor: false,
      annual: false,
      delta: false,
      slider: false,
      reversal: false
    };

    let isAnnual = true;
    let volumeMultiplier = 1;

    function toggleAnnual() {
      isAnnual = !isAnnual;
      render();
    }

    function updateVolume(val) {
      volumeMultiplier = parseInt(val, 10);
      render();
    }

    function toggleRule(k) {
      state[k] = !state[k];
      render();
    }

    function applyPreset(mode) {
      const val = mode === 'craft';
      Object.keys(state).forEach(k => state[k] = val);
      render();
    }

    function render() {
      Object.keys(state).forEach(k => {
        const pill = document.getElementById('status-' + k);
        if (state[k]) {
          pill.textContent = '已優化';
          pill.className = 'px-2 py-0.5 text-xs rounded bg-emerald-500/20 text-emerald-400 shrink-0';
        } else {
          pill.textContent = '待修正';
          pill.className = 'px-2 py-0.5 text-xs rounded bg-rose-500/20 text-rose-400 shrink-0';
        }
      });

      const topBar = document.getElementById('pricing-top');
      const grid = document.getElementById('pricing-grid');

      // Top bar: Annual toggle + Usage Slider
      const annualHTML = state.annual
        ? `<div onclick="toggleAnnual()" class="cursor-pointer inline-flex items-center gap-1.5 bg-white p-1 rounded-xl ring-1 ring-slate-900/5 shadow-sm">
             <span class="px-2 py-1 text-xs font-medium rounded-lg transition ${!isAnnual ? 'bg-slate-900 text-white' : 'text-slate-500'}">月繳</span>
             <span class="px-2 py-1 text-xs font-medium rounded-lg transition flex items-center gap-1 ${isAnnual ? 'bg-slate-900 text-white' : 'text-slate-500'}">
               年繳 <span class="px-1.5 py-0.2 text-xs rounded-full bg-emerald-500/20 text-emerald-300 font-mono">-20%</span>
             </span>
           </div>`
        : `<button onclick="toggleAnnual()" class="px-2 py-1 text-xs font-bold border border-black bg-white rounded">切換：${isAnnual ? '年繳' : '月繳'}</button>`;

      const sliderHTML = state.slider
        ? `<div class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-xl ring-1 ring-slate-900/5">
             <span class="text-xs text-slate-500">每月 API 請求：</span>
             <input type="range" min="1" max="3" value="${volumeMultiplier}" oninput="updateVolume(this.value)" class="w-20 accent-slate-900 cursor-pointer" />
             <span class="text-xs font-mono font-semibold text-slate-800 tabular-nums">${volumeMultiplier * 100}k</span>
           </div>`
        : `<span class="text-xs font-bold text-red-600">* 超出額度每千次加收 $0.50</span>`;

      topBar.innerHTML = annualHTML + sliderHTML;

      const basePro = (isAnnual ? 39 : 49) * volumeMultiplier;
      const baseTeam = (isAnnual ? 119 : 149) * volumeMultiplier;

      const tiers = [
        {
          id: 'starter',
          name: 'Starter',
          price: '$0',
          unit: '永久免費',
          slopFeatures: ['✓ 基礎 API 存取', '✓ 社群支援', '✓ 1 個專案', '✓ 每日備份'],
          craftHeader: '個人驗證與原型開發',
          craftFeatures: ['10,000 次免費請求 / 月', '單一開發環境與基礎日誌', '社群 Discord 支援'],
          cta: '免費開始'
        },
        {
          id: 'pro',
          name: 'Pro',
          price: '$' + basePro,
          unit: isAnnual ? '每月（年繳計費）' : '每月（隨時取消）',
          slopFeatures: ['✓ 基礎 API 存取', '✓ 社群支援', '✓ 無限專案', '✓ 自動擴容'],
          craftHeader: '包含 Starter 所有功能，外加：',
          craftFeatures: [`${volumeMultiplier * 100}k 次高速邊緣請求`, 'Zero-CLS 自動故障轉移', '24/7 工程師專線支援'],
          cta: '升級 Pro 方案'
        },
        {
          id: 'enterprise',
          name: 'Scale',
          price: '$' + baseTeam,
          unit: isAnnual ? '每月（年繳計費）' : '每月（隨時取消）',
          slopFeatures: ['✓ 基礎 API 存取', '✓ 社群支援', '✓ 無限專案', '✓ 專屬客戶經理'],
          craftHeader: '包含 Pro 所有功能，外加：',
          craftFeatures: ['SOC2 / HIPAA 合規稽核軌跡', '99.99% 企業級 SLA 保證', '自訂資料落地 (Data Residency)'],
          cta: '聯繫架構師'
        }
      ];

      grid.innerHTML = tiers.map(t => {
        const isHero = t.id === 'pro';

        // Card container styling
        let cardCls = 'rounded-xl p-3 border-2 border-gray-400 bg-white flex flex-col justify-between transition-all duration-300';
        if (state.anchor) {
          cardCls = isHero
            ? 'rounded-2xl p-3.5 bg-white ring-2 ring-slate-900 shadow-[0_12px_32px_-4px_rgba(15,23,42,0.12)] flex flex-col justify-between relative -translate-y-1 transition-all duration-300'
            : 'rounded-2xl p-3.5 bg-white/85 ring-1 ring-slate-900/5 shadow-sm flex flex-col justify-between transition-all duration-300';
        }

        // Badge for Hero Tier
        const heroBadge = (state.anchor && isHero)
          ? `<span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-slate-900 text-white">最多團隊選用</span>`
          : '';

        // Price formatting
        const priceHTML = state.annual
          ? `<div class="mt-2 mb-2">
               <div class="flex items-baseline gap-1">
                 <span class="text-xl font-semibold text-slate-900 tabular-nums tracking-tight">${t.price}</span>
               </div>
               <div class="text-xs text-slate-400">${t.unit}</div>
             </div>`
          : `<div class="my-2 text-center">
               <div class="text-xl font-extrabold text-blue-700">${t.price}</div>
               <div class="text-xs font-bold text-black">${t.unit}</div>
             </div>`;

        // Features list (Repetitive vs Incremental Delta)
        const featList = state.delta ? t.craftFeatures : t.slopFeatures;
        const featHeader = state.delta
          ? `<div class="text-xs font-medium ${isHero ? 'text-indigo-600' : 'text-slate-400'} mb-1.5">${t.craftHeader}</div>`
          : '';

        const featuresHTML = `
          <div class="mb-3">
            ${featHeader}
            <ul class="space-y-1 text-xs ${state.delta ? 'text-slate-600' : 'font-bold text-black'}">
              ${featList.map(f => `<li class="flex items-start gap-1"><span class="text-emerald-600 shrink-0">✓</span><span>${f}</span></li>`).join('')}
            </ul>
          </div>
        `;

        // CTA Button & Risk-Reversal Micro-copy
        let btnCls = 'w-full py-1.5 text-xs font-bold bg-blue-600 text-white rounded border border-black';
        if (state.anchor) {
          btnCls = isHero
            ? 'w-full py-1.5 text-xs font-medium bg-slate-900 hover:bg-slate-800 text-white rounded-lg shadow-sm transition active:scale-95'
            : 'w-full py-1.5 text-xs font-medium bg-slate-100 hover:bg-slate-200/80 text-slate-700 rounded-lg transition';
        }

        const microCopy = state.reversal
          ? `<div class="text-xs text-center text-slate-400 mt-1.5">${isHero ? '免綁卡 · 14 天試用' : '隨時可一鍵升降級'}</div>`
          : '';

        return `
          <div class="${cardCls}">
            <div>
              <div class="flex items-center justify-between gap-1">
                <h3 class="text-xs font-semibold text-slate-900">${t.name}</h3>
                ${heroBadge}
              </div>
              ${priceHTML}
              ${featuresHTML}
            </div>
            <div>
              <button class="${btnCls}">${t.cta}</button>
              ${microCopy}
            </div>
          </div>
        `;
      }).join('');
    }

    render();
  </script>
</body>
</html>
